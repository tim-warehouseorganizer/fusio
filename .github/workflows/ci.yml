name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # All modules, all unit + compat + dialect suites (~230 tests).
      # *IT integration tests are excluded by surefire naming and run in the
      # integration job below against real databases.
      - run: mvn -B -ntp verify

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Start MySQL and Postgres
        run: docker compose up -d --wait
      - name: Build library
        run: mvn -B -ntp -DskipTests install
      # The bulk-load bridges round-trip 10K adversarial rows byte-exact
      # against real MySQL (LOAD DATA LOCAL INFILE) and Postgres (COPY).
      - name: Run JDBC integration tests
        run: mvn -B -ntp test -pl fusio-jdbc -Dtest='MySqlLoadDataIT,PostgresCopyIT'

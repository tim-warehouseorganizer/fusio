name: Publish to GitHub Packages

# Publishes fusio-core, fusio-jdbc, and the starter to this repo's GitHub
# Packages Maven registry (fusio-bench skips itself). This is the
# pre-Central distribution channel: consumers (warehouseorganizer, tuuk)
# can resolve 1.0.0-SNAPSHOT from here instead of a local .m2. Central
# publishing (the -Prelease profile) stays a deliberate manual act — see
# docs/RELEASING.md for the 1.0.0 release gate.
on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Deploy
        run: mvn -B -ntp deploy
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
